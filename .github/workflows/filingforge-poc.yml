name: FilingForge Research POC

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      companies:
        description: "Optional comma-separated name|BSE-scrip-code values; blank selects the next Azure-tracked batch"
        required: false
        default: ""
        type: string
      batch_size:
        description: "Automatic rotation batch size when companies is blank"
        required: true
        default: 1
        type: number
      refresh_days:
        description: "Refresh completed companies after this many days"
        required: true
        default: 30
        type: number
      years:
        description: "Years of FilingForge history (100 = all available electronic history)"
        required: true
        default: 100
        type: number
      run_ai_analysis:
        description: "Generate cited NVIDIA research snapshots"
        required: true
        default: true
        type: boolean
      max_analysis_documents:
        description: "Maximum new uncached documents extracted this run (0 = attempt all)"
        required: true
        default: 25
        type: number
      max_windows_per_document:
        description: "Windows extracted per document (0 = complete overlapping coverage)"
        required: true
        default: 0
        type: number

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    env:
      INPUT_COMPANIES: ${{ inputs.companies || '' }}
      INPUT_BATCH_SIZE: ${{ inputs.batch_size || 1 }}
      INPUT_REFRESH_DAYS: ${{ inputs.refresh_days || 30 }}
      INPUT_YEARS: ${{ inputs.years || 100 }}
      INPUT_RUN_AI: ${{ github.event_name == 'schedule' || inputs.run_ai_analysis }}
      INPUT_MAX_DOCS: ${{ inputs.max_analysis_documents || 25 }}
      INPUT_MAX_WINDOWS: ${{ inputs.max_windows_per_document }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.FILINGFORGE_STORAGE_ACCOUNT }}
      SIGNALFEED_APP_BASE_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      NVIDIA_NIM_MODEL: ${{ vars.FILINGFORGE_SYNTHESIS_MODEL || 'nvidia/nemotron-3-super-120b-a12b' }}
      NVIDIA_NIM_EXTRACTION_MODEL: ${{ vars.FILINGFORGE_EXTRACTION_MODEL || 'nvidia/nemotron-3.5-lightning-30b-a3b' }}
      NVIDIA_NIM_EMBEDDING_MODEL: ${{ vars.FILINGFORGE_EMBEDDING_MODEL || 'nvidia/nemotron-3-embed-1b' }}
      RESEARCH_ANALYST_HANDBOOK: research_analyst_grounding.md
      FILINGFORGE_VERSION: e930f5daef85b6d233fe6b4f63c12086b395cdfd

    steps:
      - name: Check out POC repository
        uses: actions/checkout@v4

      - name: Check out pinned FilingForge engine
        uses: actions/checkout@v4
        with:
          repository: nandanpugalia/FilingForge
          ref: e930f5daef85b6d233fe6b4f63c12086b395cdfd
          path: vendor/filingforge

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-filingforge-poc.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-filingforge-poc.txt
          pip install -e vendor/filingforge

      - name: Run offline contract tests
        run: python test_filingforge_poc.py

      - name: Sign in to Azure for preflight
        id: azure-preflight-login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prime Azure Storage token for preflight
        run: az account get-access-token --resource https://storage.azure.com/ --output none

      - name: Validate Azure data plane and NVIDIA model
        shell: bash
        run: |
          args=(--preflight)
          if [[ "$INPUT_RUN_AI" != "true" ]]; then
            args+=(--skip-analysis)
          fi
          python filingforge_poc.py "${args[@]}"

      - name: Select automatic company batch
        id: select-batch
        if: ${{ env.INPUT_COMPANIES == '' }}
        run: >-
          python select_research_backfill_batch.py
          --batch-size "$INPUT_BATCH_SIZE"
          --refresh-days "$INPUT_REFRESH_DAYS"
          --lease-hours 8

      - name: Resolve company batch
        shell: bash
        run: |
          companies="$INPUT_COMPANIES"
          if [[ -z "$companies" ]]; then
            companies="${{ steps.select-batch.outputs.companies }}"
          fi
          echo "RESOLVED_COMPANIES=$companies" >> "$GITHUB_ENV"
          echo "Resolved batch size: ${{ steps.select-batch.outputs.count || 'manual' }}"

      - name: Pull, convert, and analyze locally
        id: prepare
        if: ${{ env.RESOLVED_COMPANIES != '' }}
        continue-on-error: true
        shell: bash
        run: |
          args=(
            --companies "$RESOLVED_COMPANIES"
            --years "$INPUT_YEARS"
            --library-root FilingForgeLibrary
            --output-root poc-output
            --max-analysis-documents "$INPUT_MAX_DOCS"
            --max-windows-per-document "${INPUT_MAX_WINDOWS:-0}"
            --seed-from-azure
            --prepare-only
          )
          if [[ "$INPUT_RUN_AI" != "true" ]]; then
            args+=(--skip-analysis)
          fi
          python filingforge_poc.py "${args[@]}"

      - name: Sign in to Azure with fresh GitHub OIDC token
        if: ${{ always() && steps.prepare.outcome != 'skipped' }}
        id: azure-login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prime Azure Storage access token
        if: ${{ always() && steps.azure-login.outcome == 'success' }}
        run: az account get-access-token --resource https://storage.azure.com/ --output none

      - name: Upload prepared Markdown and research
        if: ${{ always() && steps.azure-login.outcome == 'success' }}
        run: >-
          python filingforge_poc.py
          --companies "$RESOLVED_COMPANIES"
          --library-root FilingForgeLibrary
          --output-root poc-output
          --upload-only

      - name: Fail after preserving partial preparation output
        if: ${{ always() && steps.prepare.outcome == 'failure' }}
        run: |
          echo "One or more companies failed during preparation; successfully prepared outputs were still uploaded."
          exit 1

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          echo "## FilingForge POC" >> "$GITHUB_STEP_SUMMARY"
          echo "- Companies: $RESOLVED_COMPANIES" >> "$GITHUB_STEP_SUMMARY"
          echo "- Years: $INPUT_YEARS" >> "$GITHUB_STEP_SUMMARY"
          echo "- NVIDIA analysis: $INPUT_RUN_AI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storage account: $AZURE_STORAGE_ACCOUNT" >> "$GITHUB_STEP_SUMMARY"
          if [[ -d poc-output ]]; then
            find poc-output -name manifest.json -print | sed 's/^/- Manifest: /' >> "$GITHUB_STEP_SUMMARY"
            find poc-output -name research.json -print | sed 's/^/- Research: /' >> "$GITHUB_STEP_SUMMARY"
          fi
