name: Technicals Cache Refresh
on:
  schedule:
    - cron: '30 12 * * 1-5'  # 12:30 UTC = 6:00pm IST, weekdays only
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Refresh technicals in batches until the universe is caught up
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for i in $(seq 1 60); do
            echo "Batch $i"
            curl -sS --max-time 55 -w "\nHTTP_STATUS:%{http_code}\n" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/companies/technicals/refresh?batchSize=100"
            sleep 20
          done
